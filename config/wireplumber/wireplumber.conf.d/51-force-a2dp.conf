{
  "monitor.bluez.rules": [
    {
      "matches": [
        {
          "device.name": "~bluez_card.*"
        }
      ],
      "actions": {
        "update-props": {
          "bluez5.auto-connect": "[ a2dp_sink ]",
          "bluez5.disabled-profiles": "[ hsp_hs hsp_ag hfp_hf hfp_ag ]"
        }
      }
    }
  ]
}
